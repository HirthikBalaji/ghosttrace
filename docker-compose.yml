# GHOSTTRACE — synthetic demo stack. Trusted local environment only (demo-only auth).
name: ghosttrace
services:
  falkordb:
    image: falkordb/falkordb:v4.22.0
    environment:
      # Persistence: append-only file (fsync every second) + RDB snapshots; data in the named volume.
      REDIS_ARGS: "--appendonly yes --appendfsync everysec --save 60 1 --save 300 10"
      FALKORDB_ARGS: "MAX_QUEUED_QUERIES 25 TIMEOUT 5000 RESULTSET_SIZE 10000"
      BROWSER: "0"
    ports: ["127.0.0.1:${GT_FALKORDB_PORT:-6379}:6379"]
    volumes: ["falkordb-data:/var/lib/falkordb/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy: { resources: { limits: { memory: 1g, cpus: "2" } } }
    restart: unless-stopped

  backend:
    image: ghosttrace-backend:local
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      GT_FALKORDB_HOST: falkordb
      GT_FALKORDB_PORT: "6379"
      GT_DEMO_TOKEN: ${GT_DEMO_TOKEN:?set GT_DEMO_TOKEN in .env (see .env.example)}
      GT_CORS_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
      GT_LLM_PROVIDER: ${GT_LLM_PROVIDER:-mock}
    depends_on: { falkordb: { condition: service_healthy } }
    ports: ["127.0.0.1:8000:8000"]
    read_only: true
    tmpfs: ["/tmp", "/srv/.artifacts:uid=10001,gid=10001,mode=0700"]
    security_opt: ["no-new-privileges:true"]
    deploy: { resources: { limits: { memory: 768m, cpus: "2" } } }
    restart: unless-stopped

  frontend:
    image: ghosttrace-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args: { VITE_GT_DEMO_TOKEN: "${GT_DEMO_TOKEN}" }
    depends_on: [backend]
    ports: ["127.0.0.1:8080:8080"]
    security_opt: ["no-new-privileges:true"]
    deploy: { resources: { limits: { memory: 128m } } }
    restart: unless-stopped

volumes:
  falkordb-data: {}
